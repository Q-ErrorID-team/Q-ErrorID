[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q-error-id"
version = "0.6.0"
description = "Interpretable local quantum error-generator reconstruction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "qiskit>=2.2,<2.3",
  "qiskit-aer>=0.17,<0.18",
]

[project.optional-dependencies]
haiqu = ["haiqu-sdk>=1.3.1,<2"]
test = ["build>=1.2", "pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
